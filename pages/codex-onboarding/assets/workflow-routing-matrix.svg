<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Routing Matrix</title>
  <desc id="desc">Use this to answer: should the work live in RovoDev, Cursor, Codex App, or a shared skill?</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#102033" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="64" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Workflow Routing Matrix</text>
  <text x="64" y="112" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Use this to answer: should the work live in RovoDev, Cursor, Codex App, or a shared skill?</text>
  
  <g filter="url(#shadow)">
  <rect x="80" y="160" width="270" height="170" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="104" y="202" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">RovoDev CLI</text>
  <text x="104" y="236" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Known CLI workflow</text>
<text x="104" y="262" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Fast command loop</text>
<text x="104" y="288" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Existing team habit</text>
</g>
  <g filter="url(#shadow)">
  <rect x="400" y="160" width="270" height="170" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="424" y="202" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Cursor</text>
  <text x="424" y="236" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">In-editor code work</text>
<text x="424" y="262" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Tight file navigation</text>
<text x="424" y="288" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Human steers edits</text>
</g>
  <g filter="url(#shadow)">
  <rect x="720" y="160" width="270" height="170" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="744" y="202" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Codex App</text>
  <text x="744" y="236" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Local artifact workflow</text>
<text x="744" y="262" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Threads + receipts</text>
<text x="744" y="288" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Review and handoff</text>
</g>
  <g filter="url(#shadow)">
  <rect x="1040" y="160" width="270" height="170" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1064" y="202" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Shared Skill</text>
  <text x="1064" y="236" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Repeated process</text>
<text x="1064" y="262" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Reusable playbook</text>
<text x="1064" y="288" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Cross-tool versioning</text>
</g>
  <g filter="url(#shadow)">
  <rect x="240" y="450" width="320" height="170" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="264" y="492" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Green for Codex</text>
  <text x="264" y="526" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Project review</text>
<text x="264" y="552" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Workspace hygiene</text>
<text x="264" y="578" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Personal/team OS</text>
<text x="264" y="604" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Session handoff</text>
</g>
  <g filter="url(#shadow)">
  <rect x="610" y="450" width="320" height="170" rx="20" fill="#eef6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="634" y="492" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Green for RovoDev/Cursor</text>
  <text x="634" y="526" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">CLI or editor loops</text>
<text x="634" y="552" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Existing commands</text>
<text x="634" y="578" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Editor-first changes</text>
</g>
  <g filter="url(#shadow)">
  <rect x="980" y="450" width="320" height="170" rx="20" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="1004" y="492" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Hold / Do Not Automate</text>
  <text x="1004" y="526" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Secrets</text>
<text x="1004" y="552" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Production mutation</text>
<text x="1004" y="578" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Unapproved plugins</text>
<text x="1004" y="604" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Ambiguous ownership</text>
</g>
  
</svg>
