<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Advanced Codex Topics from X Bookmarks</title>
  <desc id="desc">The deeper material to use after onboarding, not during the first setup walkthrough.</desc>
  <defs>
