  <text x="104" y="192" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Context + Token Hygiene</text>
  <text x="104" y="226" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Limit noisy output</text>
<text x="104" y="252" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Keep AGENTS.md focused</text>
</g>
