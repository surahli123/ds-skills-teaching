<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Before / After: One-Off Answer to Workflow With Evidence</title>
  <desc id="desc">The live demo should prove that Codex can leave an inspectable trail, not just produce a nice answer.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#102033" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="64" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Before / After: One-Off Answer to Workflow With Evidence</text>
  <text x="64" y="112" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">The live demo should prove that Codex can leave an inspectable trail, not just produce a nice answer.</text>
  
  <g filter="url(#shadow)">
  <rect x="70" y="160" width="560" height="220" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="94" y="202" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Before: One-Off AI Chat</text>
  <text x="94" y="236" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Prompt disappears into terminal/chat</text>
<text x="94" y="262" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">No durable worksheet</text>
<text x="94" y="288" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">No verification receipt</text>
<text x="94" y="314" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Hard to hand off</text>
</g>
  <g filter="url(#shadow)">
  <rect x="770" y="160" width="560" height="220" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="794" y="202" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">After: Workflow With Evidence</text>
  <text x="794" y="236" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Codex App thread</text>
<text x="794" y="262" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Worksheet artifact</text>
<text x="794" y="288" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Receipt with checks and risks</text>
<text x="794" y="314" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Next-session handoff prompt</text>
</g>
  <line x1="640" y1="270" x2="760" y2="270" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
  <rect x="100" y="500" width="360" height="160" rx="20" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="124" y="542" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Old failure mode</text>
  <text x="124" y="576" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Looks useful in the moment</text>
<text x="124" y="602" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">But the next person cannot inspect it</text>
</g>
  <g filter="url(#shadow)">
  <rect x="520" y="500" width="360" height="160" rx="20" fill="#eef6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="544" y="542" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Correct routing</text>
  <text x="544" y="576" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">RovoDev: Atlassian-native default</text>
<text x="544" y="602" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Codex: Atlassian MCP when configured</text>
</g>
  <g filter="url(#shadow)">
  <rect x="940" y="500" width="360" height="160" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="964" y="542" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">New habit</text>
  <text x="964" y="576" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Start with a workflow</text>
<text x="964" y="602" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">End with a receipt</text>
</g>
  
</svg>
