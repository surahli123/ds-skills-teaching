<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Offsite Workshop Flow</title>
  <desc id="desc">Matches the live agenda: 10 min landscape, 30 min setup, 15 min workflow routing.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#102033" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="64" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Offsite Workshop Flow</text>
  <text x="64" y="112" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Matches the live agenda: 10 min landscape, 30 min setup, 15 min workflow routing.</text>
  
  <g filter="url(#shadow)">
  <rect x="80" y="170" width="360" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="104" y="212" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">10 min: Landscape</text>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Codex, Claude Code, RovoDev</text>
<text x="104" y="272" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Token budgets</text>
<text x="104" y="298" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Tool and policy limits</text>
</g>
  <g filter="url(#shadow)">
  <rect x="520" y="170" width="360" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="544" y="212" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">30 min: Setup</text>
  <text x="544" y="246" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Migrate from RovoDev CLI</text>
<text x="544" y="272" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Create Codex setup receipt</text>
<text x="544" y="298" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Skip deep MCP details</text>
</g>
  <g filter="url(#shadow)">
  <rect x="960" y="170" width="360" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="984" y="212" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">15 min: Routing</text>
  <text x="984" y="246" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Where should work live?</text>
<text x="984" y="272" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">RovoDev vs Codex App</text>
<text x="984" y="298" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Do-not-automate cases</text>
</g>
  <line x1="440" y1="265" x2="515" y2="265" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="880" y1="265" x2="955" y2="265" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
  <rect x="235" y="470" width="320" height="170" rx="20" fill="#eef6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="259" y="512" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Output 1</text>
  <text x="259" y="546" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Tool landscape</text>
<text x="259" y="572" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">and decision frame</text>
</g>
  <g filter="url(#shadow)">
  <rect x="560" y="470" width="320" height="170" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="584" y="512" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Output 2</text>
  <text x="584" y="546" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Migration worksheet</text>
<text x="584" y="572" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">and setup checklist</text>
</g>
  <g filter="url(#shadow)">
  <rect x="885" y="470" width="320" height="170" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="909" y="512" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Output 3</text>
  <text x="909" y="546" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Workflow matrix</text>
<text x="909" y="572" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">and next actions</text>
</g>
  
</svg>
