<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a Trustworthy AI Receipt</title>
  <desc id="desc">A receipt turns an AI answer into inspectable work a teammate can continue.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#102033" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="64" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Anatomy of a Trustworthy AI Receipt</text>
  <text x="64" y="112" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">A receipt turns an AI answer into inspectable work a teammate can continue.</text>
  
  <g filter="url(#shadow)">
  <rect x="80" y="150" width="340" height="130" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="104" y="192" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">1. Goal</text>
  <text x="104" y="226" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">What was the agent asked to do?</text>
<text x="104" y="252" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">What counts as done?</text>
</g>
  <g filter="url(#shadow)">
  <rect x="500" y="150" width="340" height="130" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="524" y="192" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">2. Inputs Inspected</text>
  <text x="524" y="226" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Files, tickets, docs, threads</text>
<text x="524" y="252" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Atlassian MCP when configured</text>
</g>
  <g filter="url(#shadow)">
  <rect x="920" y="150" width="340" height="130" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="944" y="192" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">3. Tools Used</text>
  <text x="944" y="226" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Shell, MCP, plugins</text>
<text x="944" y="252" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Slack where approved</text>
</g>
  <g filter="url(#shadow)">
  <rect x="80" y="360" width="340" height="155" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="104" y="402" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">4. Artifact Created</text>
  <text x="104" y="436" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Worksheet, checklist, viewer</text>
<text x="104" y="462" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Report or handoff</text>
</g>
  <g filter="url(#shadow)">
  <rect x="500" y="360" width="340" height="155" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="524" y="402" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">5. Verification</text>
  <text x="524" y="436" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Checks run</text>
<text x="524" y="462" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Sources reviewed</text>
<text x="524" y="488" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Visual inspection</text>
</g>
  <g filter="url(#shadow)">
  <rect x="920" y="360" width="340" height="155" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="944" y="402" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">6. Risks</text>
  <text x="944" y="436" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Unknowns</text>
<text x="944" y="462" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Policy caveats</text>
<text x="944" y="488" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Unsupported connectors</text>
</g>
  <g filter="url(#shadow)">
  <rect x="355" y="620" width="690" height="120" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="379" y="662" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">7. Next Prompt</text>
  <text x="379" y="696" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">The exact prompt another person can use to continue the work.</text>
</g>
  <line x1="420" y1="215" x2="495" y2="215" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="840" y1="215" x2="915" y2="215" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="250" y1="280" x2="250" y2="355" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="670" y1="280" x2="670" y2="355" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1090" y1="280" x2="1090" y2="355" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="670" y1="515" x2="670" y2="615" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  
</svg>
